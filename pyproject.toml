[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agitentic"
version = "0.3.0"
description = "Agentic git/GitHub helper skills for coding agents, with a Claude Code / Codex plugin installer."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bryce Adelstein Lelbach" }]
keywords = ["git", "github", "fork", "agent-skills", "coding"]
# No runtime dependencies: the skills are self-contained shell scripts that
# need only `git` and `gh` on PATH. The package exists to register the
# plugin with the agent hosts (`agitentic install-plugins`).
dependencies = []

[project.scripts]
agitentic = "agitentic_pkg._entry:main"

[project.urls]
Homepage = "https://github.com/brycelelbach/agitentic"
Repository = "https://github.com/brycelelbach/agitentic"

# Bundle the plugin payload (skills + their scripts + lib/) inside the
# agitentic_pkg package so the installer can locate it.
[tool.hatch.build.targets.wheel]
packages = ["agitentic_pkg"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/agitentic" = "agitentic_pkg/plugins/agitentic"
